name: Apptainer Build Deploy

# - Pull requests touching the container files only build and test the container.
# - Pushing a git tag (e.g., "v3") also publishes it to ghcr.io/<owner>/<repo>/sionna.sif:<tag>.
# - The workflow can also be run manually. To publish from a branch, set a container tag in the inputs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Container tag to publish (leave empty to only build and test)"
        required: false
        default: ""
      torch_cuda:
        description: "CUDA flavor of the PyTorch build (cu126 or cu130)"
        required: false
        default: "cu126"
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "cluster/**"
      - ".github/workflows/apptainer-build-deploy.yml"

jobs:
  build-test-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    container:
        image: ghcr.io/apptainer/apptainer:1.3.2
        options: --privileged
        volumes:
          # The runner's large temporary disk. The container image is too big for the default disk
          - /mnt:/mnt

    name: Build Container
    env:
      TORCH_CUDA: ${{ inputs.torch_cuda || 'cu126' }}
      APPTAINER_TMPDIR: /mnt/apptainer/tmp
      APPTAINER_CACHEDIR: /mnt/apptainer/cache
      SIF_PATH: /mnt/apptainer/sionna.sif
    steps:

      - name: Check out code for the container builds
        uses: actions/checkout@v4

      - name: Print environment variables
        run: |
          echo "Repository name: ${{github.repository}}"
          echo "Repository owner: ${{github.repository_owner}}"
          echo "Ref: ${{github.ref}} (${{github.ref_type}})"
          df -h / /mnt

      - name: Build Container
        run: |
           mkdir -p "$APPTAINER_TMPDIR" "$APPTAINER_CACHEDIR"
           apptainer build --build-arg TORCH_CUDA=${TORCH_CUDA} "$SIF_PATH" cluster/sionna.def
           df -h / /mnt

      - name: Test Container
        run: |
           apptainer exec "$SIF_PATH" python -c "import torch, sionna; print('torch', torch.__version__, '| sionna', sionna.__version__)"
           apptainer exec "$SIF_PATH" jupyter kernelspec list

      - name: Login and Deploy Container
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        run: |
           TAG="${{ inputs.tag || github.ref_name }}"
           REPO=$(echo "${{github.repository}}" | tr '[:upper:]' '[:lower:]')   # Registry names must be lowercase
           echo ${{ secrets.GITHUB_TOKEN }} | apptainer registry login -u ${{github.repository_owner}} --password-stdin oras://ghcr.io
           apptainer push "$SIF_PATH" oras://ghcr.io/${REPO}/sionna.sif:${TAG}
